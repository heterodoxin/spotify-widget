[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spotify-widget"
version = "1.0.0"
description = "A floating card that shows synced lyrics for the song playing in Spotify"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "heterodoxin" }]
keywords = ["spotify", "lyrics", "widget", "mpris", "hyprland"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "PySide6>=6.6",
    "requests>=2.28",
    "jeepney>=0.8; sys_platform != 'win32' and sys_platform != 'darwin'",
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Control>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/heterodoxin/spotify-widget"

[project.scripts]
spotify-widget = "spotify_widget.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_widget"]

[tool.pytest.ini_options]
testpaths = ["tests"]
